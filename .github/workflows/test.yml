name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Dictator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: seuros/setup-dictator@master
        with:
          version: '0.28.1'
      - run: dictator lint --format github .

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            rust = { version = "1.99", components = "clippy,rustfmt" }

      - name: Reject path-sourced sibling crates in Cargo.lock
        run: |
          ruby -rjson -e '
            own = JSON.parse(`cargo metadata --no-deps --format-version 1`).fetch("packages").map { |pkg| pkg["name"] }
            stray = File.read("Cargo.lock").split("[[package]]").filter_map do |pkg|
              name = pkg[/^name = "([^"]+)"/, 1]
              next unless name && name.end_with?("-machines") && !own.include?(name)
              name unless pkg.match?(/^source = "registry/)
            end
            abort "Cargo.lock pins sibling crates without a registry source: #{stray.join(", ")}" unless stray.empty?
          '
      - name: Lint the crate
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features testing -- -D warnings

      - name: Test the crate
        run: cargo test

      - name: Run doc tests
        run: cargo test --doc --features testing

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build the docs (no features, testing)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps -p matryona-machines
          cargo doc --no-deps -p matryona-machines --features testing

  ruby:
    name: Ruby feature (embedded VM)
    # The test binary links a static libruby, which carries YJIT's own Rust
    # runtime: Linux linkers reject the duplicate `rust_eh_personality`, the
    # macOS linker only warns. Gems never link libruby, so this binds only here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            ruby = "4.0"
            rust = { version = "1.99", components = "clippy" }

      - name: Lint with the ruby feature
        run: cargo clippy --workspace --all-targets --features ruby -- -D warnings

      - name: Test inside a live Ruby
        run: cargo test -p matryona-machines-embedded

      - name: Run the ruby doc tests (symbols! compile-time checks)
        run: cargo test --doc --features ruby

      - name: Build the docs (ruby, all features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps -p matryona-machines --features ruby
          cargo doc --no-deps -p matryona-machines --all-features

  bare-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            rust = { version = "1.99", components = "clippy", targets = "thumbv7em-none-eabihf" }

      - name: Build and lint on bare metal
        run: |
          cargo build --target thumbv7em-none-eabihf
          cargo build --target thumbv7em-none-eabihf --features testing
          cargo clippy --target thumbv7em-none-eabihf --features testing -- -D warnings
